# デプロイ先: /etc/nginx/sites-available/expenses (シンボリックリンク: sites-enabled/expenses)
# フロントエンド(/var/www/expenses)の静的配信 + バックエンドAPI(/api/)へのリバースプロキシ
# SSL証明書は certbot (Let's Encrypt) で発行・自動更新

server {
    listen 80;
    server_name <YOUR_SERVER_IP> expenses.rendesu.com;

    return 301 https://expenses.rendesu.com$request_uri;
}

server {
    listen 443 ssl;
    server_name expenses.rendesu.com;

    root /var/www/expenses;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/expenses.rendesu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/expenses.rendesu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
